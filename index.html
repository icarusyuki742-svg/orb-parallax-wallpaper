<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Neural Shard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="scene">

        <!-- Background atmosphere -->
        <div class="ambient ambient-left"></div>
        <div class="ambient ambient-right"></div>


        <!-- Very subtle neural network -->
        <canvas
            id="networkCanvas">
        </canvas>


        <!-- Main object -->
        <section class="artifact">

            <!-- Outer soft aura -->
            <div class="artifact-aura"></div>


            <!-- Concrete / glass shell -->
            <div class="shell">

                <!-- Concrete highlight -->
                <div class="shell-light"></div>

                <!-- Interior darkness -->
                <div class="inner-space"></div>


                <!-- Technical incomplete coating -->
                <div class="technical-ring ring-1"></div>

                <div class="technical-ring ring-2"></div>

                <div class="technical-ring ring-3"></div>


                <!-- Purple crystal -->
                <div class="crystal">

                    <div class="crystal-face face-left"></div>

                    <div class="crystal-face face-right"></div>

                    <div class="crystal-face face-center"></div>

                    <div class="crystal-edge"></div>

                    <div class="crystal-light"></div>

                </div>


                <!-- tiny inner light -->
                <div class="core-light"></div>

            </div>

        </section>


        <!-- Mouse proximity glow -->
        <div class="cursor-glow"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
